# Board Game Curator database on the Hostinger VPS (~/bgc-db):
#   postgres  the data (private: only reachable from n8n, NocoDB, the API and the backup job)
#   nocodb    an Airtable-like grid over the data (127.0.0.1:8080, and via the Cloudflare tunnel)
#   backup    nightly plain-SQL dump pushed to a private GitHub repo (git keeps every night); restore.sh brings one back
#   pages     rulebook pages for Nathan to read (a PDF is kept only until it has been read)
# Secrets live in ./.env on the server (see .env.example); never commit them. The API (~/bgc-api) reads the same .env.
# Memory limits are caps against one container starving the others on a small box, not sizes it needs: Postgres uses
# ~200 MB at rest, NocoDB ~300 MB, the backup job a few MB except while pg_dump runs.
# Image tags: postgres:16-alpine and nocodb/nocodb:latest are left as they were, because pinning blind could move a running
# instance up or down. To pin to what runs today, read the version and put it in the tag:
#   docker exec bgc-postgres postgres --version
#   docker exec bgc-nocodb sh -c 'grep "\"version\"" /usr/src/app/package.json'      (NocoDB's own version)
#   docker image inspect nocodb/nocodb:latest --format '{{index .RepoDigests 0}}'    (or pin by digest: image: nocodb/nocodb@sha256:...)
name: bgc-db

services:
  postgres:
    image: postgres:16-alpine
    container_name: bgc-postgres
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_USER: bgc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bgc
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks: [default, n8n]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgc -d bgc"]
      interval: 10s
      timeout: 5s
      retries: 10

  nocodb:
    image: nocodb/nocodb:latest
    container_name: bgc-nocodb
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NC_DB: pg://bgc-postgres:5432?u=bgc&p=${POSTGRES_PASSWORD}&d=nocodb
      NC_AUTH_JWT_SECRET: ${NC_JWT_SECRET}
      NC_DISABLE_TELE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ncdata:/usr/app/data
    networks: [default, n8n]   # the n8n network is where the Cloudflare tunnel lives
    healthcheck:               # NocoDB's own health endpoint; the image is Alpine, so busybox wget is there
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  backup:
    build: ./backup           # postgres:16-alpine with git and ssh installed once (backup/Dockerfile)
    image: bgc-backup
    container_name: bgc-backup
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PGHOST: bgc-postgres
      PGUSER: bgc
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_REPO: ${BACKUP_REPO}
      BACKUP_AT: "09:30"   # UTC, i.e. early morning in the US
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./restore.sh:/restore.sh:ro   # docker exec -it bgc-backup sh /restore.sh <database> [date]
      - ./keys:/keys:ro
      - backuprepo:/repo
    entrypoint: ["/bin/sh", "/backup.sh"]

  # Rulebook pages: holds an uploaded PDF only while Nathan reads it (never backed up; no published ports)
  pages:
    build: ./pages
    container_name: bgc-pages
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      - pagework:/work
    networks: [n8n]
    healthcheck:               # GET /health (pages/app.py); the image is python-slim with no wget or curl, so Python asks
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  ncdata:
  backuprepo:
  pagework:

networks:
  n8n:
    external: true
    name: n8n-ckq4_default
